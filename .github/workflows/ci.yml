name: ci
on:
  push: { branches: ["**"] }
  pull_request:
jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform_scripts
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --recursive
      - uses: bridgecrewio/checkov-action@v12
        with: { directory: terraform_scripts, quiet: true, soft_fail: true }
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The unit tests stub the Azure SDK and requests/urllib3 (see
      # tests/conftest.py), so only pytest is needed — no function deps.
      - run: pip install pytest
      - run: pytest -q
